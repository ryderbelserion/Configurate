name: Release Build

env:
  GRADLE_USERNAME: ${{ secrets.GRADLE_USERNAME }}
  GRADLE_PASSWORD: ${{ secrets.GRADLE_PASSWORD }}

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Project
        run: gradle create

      - name: Setup Upstream
        run: gradle clone

      - name: Apply Patches
        run: gradle apply

      - name: Publish Core Project
        run: gradle configurate-core:publish

      - name: Publish Gson Project
        run: gradle configurate-gson:publish

      - name: Publish Jackson Project
        run: gradle configurate-jackson:publish

      - name: Publish Yaml Project
        run: gradle configurate-yaml:publish